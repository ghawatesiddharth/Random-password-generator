<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Generate a <span>Random Password</span></h1>

        <div class="display">
            <input type="text" id="password" placeholder="Your password" readonly>
            <button class="copy-btn" onclick="copyPassword()" aria-label="Copy password">
                <img src="images.png" alt="Copy">
            </button>
        </div>

        <button class="generate-btn" onclick="createPassword()">
            Generate Password
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
